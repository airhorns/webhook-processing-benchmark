[package]
name = "wpb-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wpb-client"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "time", "fs", "signal", "sync"] }
hyper = { version = "1.4", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.7"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hdrhistogram = "7.5"
clap = { version = "4.5", features = ["derive"] }
humantime = "2.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
