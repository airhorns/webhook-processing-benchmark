[package]
name = "wpb-rust-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wpb-rust-server"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "signal", "fs", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1.4", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
bytes = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = { version = "0.14", optional = true }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
libc = "0.2"
anyhow = "1"

[features]
default = []
simd = ["dep:simd-json"]
